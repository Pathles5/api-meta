name: CI

on:
  push:
    branches: [pre, int, pro]
  pull_request:
    branches: [pre, int, pro]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI spec
        run: npx @apidevtools/swagger-cli validate docs/openapi.yaml

      - name: Verify Express routes match OpenAPI spec
        run: node scripts/validate-routes.js

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Run tests with coverage
        run: pnpm test:coverage:threshold

      - name: Audit dependencies
        run: pnpm audit --audit-level=critical

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/dev' && github.event_name == 'push'
    environment: ${{ github.ref_name }}
    env:
      IG_ENV: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: eu-west-1

      - name: Verify Identity
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Bootstrap (if needed)
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region eu-west-1 2>/dev/null; then
            cdk bootstrap
          else
            echo "CDKToolkit stack already exists, skipping bootstrap"
          fi

      - name: Pre-deploy health check
        run: |
          set -euo pipefail

          STACK_NAME="ig-api-${IG_ENV}"
          TABLE_NAME="ig-posts-${IG_ENV}"

          echo "========================================"
          echo " PRE-DEPLOY HEALTH CHECK"
          echo "========================================"

          # 1. Verify if the CloudFormation stack exists
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region eu-west-1 \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Stack status: $STACK_STATUS"

          # 2. Verify if the DynamoDB table exists
          TABLE_STATUS=$(aws dynamodb describe-table \
            --table-name "${TABLE_NAME}" \
            --region eu-west-1 \
            --query 'Table.TableStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Table status: $TABLE_STATUS"

          # 3. Detect drift if the stack exists
          if [ "$STACK_STATUS" != "NOT_FOUND" ]; then
            DRIFT_STATUS=$(aws cloudformation detect-stack-drift \
              --stack-name "${STACK_NAME}" \
              --region eu-west-1 \
              --query 'StackDriftDetectionId' \
              --output text 2>/dev/null || echo "DRIFT_CHECK_FAILED")
            echo "Drift detection ID: $DRIFT_STATUS"
          fi

          # 4. Decision logic
          if [ "$STACK_STATUS" = "NOT_FOUND" ]; then
            echo "Stack does not exist. Clean deploy."
          elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || [ "$STACK_STATUS" = "UPDATE_COMPLETE" ] || [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            if [ "$TABLE_STATUS" = "NOT_FOUND" ]; then
              echo ""
              echo " WARNING: Stack exists but DynamoDB table '\' is MISSING."
              echo " This indicates possible drift (table may have been deleted manually)."
              echo ""
              echo " CDK deploy will attempt to recreate the table."
              echo " If deploy fails, run:"
              echo "   aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}" --region eu-west-1"
              echo ""
            else
              echo "Stack and table exist. Normal update deploy."
            fi
          else
            echo ""
            echo " ERROR: Stack in unexpected state: $STACK_STATUS"
            echo " Manual intervention required."
            echo " Check: https://eu-west-1.console.aws.amazon.com/cloudformation"
            echo ""
            exit 1
          fi

          echo "========================================"
          echo " HEALTH CHECK COMPLETE"
          echo "========================================"

      - name: CDK Deploy
        env:
          IG_ENV: ${{ env.IG_ENV }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          AUTH_API_KEY: ${{ secrets.AUTH_API_KEY }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          APP_LOG_LEVEL: info
          POST_VERIFICATION_HOURS: "24"
          ALARM_EMAIL: antonio.lopez.sarmiento@gmail.com
        run: cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Output API URL
        run: |
          echo "API URL: $(cat cdk-outputs.json | grep apiUrl)"
          rm -f cdk-outputs.json
