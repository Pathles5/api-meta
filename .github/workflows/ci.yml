name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=critical

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::159177056493:role/GitHubActionsDeployRole
          aws-region: eu-west-1

      - name: Verify Identity
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Build production bundle
        run: |
          mkdir -p dist
          cp -r src lambda.js dist/
          # Strip devEngines (blocks npm; pnpm restriction not needed at runtime)
          jq 'del(.devEngines)' package.json > dist/package.json
          cd dist
          pnpm install --prod --ignore-scripts
          echo "Bundle size: $(du -sh . | cut -f1)"
          ls -la

      - name: CDK Bootstrap (if needed)
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region eu-west-1 2>/dev/null; then
            cdk bootstrap
          else
            echo "CDKToolkit stack already exists, skipping bootstrap"
          fi

      - name: Pre-deploy health check
        run: |
          set -euo pipefail

          echo "========================================"
          echo " PRE-DEPLOY HEALTH CHECK"
          echo "========================================"

          # 1. Verify if the CloudFormation stack exists
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name ig-api \
            --region eu-west-1 \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Stack status: $STACK_STATUS"

          # 2. Verify if the DynamoDB table exists
          TABLE_STATUS=$(aws dynamodb describe-table \
            --table-name ig-posts \
            --region eu-west-1 \
            --query 'Table.TableStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Table status: $TABLE_STATUS"

          # 3. Detect drift if the stack exists
          if [ "$STACK_STATUS" != "NOT_FOUND" ]; then
            DRIFT_STATUS=$(aws cloudformation detect-stack-drift \
              --stack-name ig-api \
              --region eu-west-1 \
              --query 'StackDriftDetectionId' \
              --output text 2>/dev/null || echo "DRIFT_CHECK_FAILED")
            echo "Drift detection ID: $DRIFT_STATUS"
          fi

          # 4. Decision logic
          if [ "$STACK_STATUS" = "NOT_FOUND" ]; then
            echo "Stack does not exist. Clean deploy."
          elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || [ "$STACK_STATUS" = "UPDATE_COMPLETE" ]; then
            if [ "$TABLE_STATUS" = "NOT_FOUND" ]; then
              echo ""
              echo " WARNING: Stack exists but DynamoDB table 'ig-posts' is MISSING."
              echo " This indicates possible drift (table may have been deleted manually)."
              echo ""
              echo " CDK deploy will attempt to recreate the table."
              echo " If deploy fails, run:"
              echo "   aws cloudformation continue-update-rollback --stack-name ig-api --region eu-west-1"
              echo ""
            else
              echo "Stack and table exist. Normal update deploy."
            fi
          elif [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            echo ""
            echo " ERROR: Stack is in ROLLBACK state: $STACK_STATUS"
            echo " This means a previous deployment failed and the stack rolled back."
            echo ""
            echo " To recover, run:"
            echo "   aws cloudformation continue-update-rollback --stack-name ig-api --region eu-west-1"
            echo ""
            exit 1
          else
            echo ""
            echo " ERROR: Stack in unexpected state: $STACK_STATUS"
            echo " Manual intervention required."
            echo " Check: https://eu-west-1.console.aws.amazon.com/cloudformation"
            echo ""
            exit 1
          fi

          echo "========================================"
          echo " HEALTH CHECK COMPLETE"
          echo "========================================"

      - name: CDK Deploy
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          AUTH_API_KEY: ${{ secrets.AUTH_API_KEY }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          APP_LOG_LEVEL: info
          POST_VERIFICATION_HOURS: "24"
        run: cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Output API URL
        run: |
          echo "API URL: $(cat cdk-outputs.json | grep apiUrl)"
          rm -f cdk-outputs.json
